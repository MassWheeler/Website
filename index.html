<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Click Story</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      cursor: pointer;
    }

    #container {
      width: 90%;
      max-width: 700px;
    }

    pre {
      font-size: 1.2rem;
      min-height: 200px;
      white-space: pre-wrap;
    }

    .hint {
      margin-top: 20px;
      opacity: 0.6;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="container">
    <pre id="text"></pre>
    <div class="hint">tap or click anywhere to continue</div>
  </div>

  <script>
    // ✏️ EASY TO EDIT TEXT
    const segments = [
      "Hi Holly I dont have the money for flowers so this will have to do",
      "I made this kinda quick so it might be shit",
      "But I wanted to apologise ASAP",
      "I have done a LOT of thinking recently and nearly said this last night I have the same self destructive aspects that you have I did not notice them properly and thought it was just me overthinking Hence me not saying anything yesterday",
      "I am not as put together as you seem to think - I am the same as you in more ways than I can even explain. I am being self destructive just like you. Today took that and told me to lock the fuck in",
      "I cannot fumble you.",
      "I spent like 10 minutes changing the code to let that sink in with the fullstop - just needed the appreciation there",
      "FUCK SHIT FUCK I WROTE OUT A PARAGRAPH AND USED A SPEECH MARK WHICH FUCKED UP EVERYTHING FUCK SHIT FUCK",
      "In a nutshell. My life has been better since you came into it and you have made every day better than the last. I have not been the man you fell for. I have been a little fucking bastard haha so imma lock in to stop the being bothered (can we put that in speech marks because I cannot use them)",
      "I mean what I have said to you and will show it in more ways than I am now",
      "Not in a lovebombing way either (I also do wanna come tomorrow I was being petty)",
      "ok back to finishing the advent calendar",
      "<3"


    ];

    const textEl = document.getElementById("text");
    const hintEl = document.querySelector(".hint");

    let segmentIndex = 0;
    let charIndex = 0;
    let isTyping = true;

    const typingSpeed = 16; // milliseconds per character

    function typeText() {
      if (!isTyping) return;

      const current = segments[segmentIndex];

      if (charIndex < current.length) {
        textEl.textContent += current.charAt(charIndex);
        charIndex++;
        setTimeout(typeText, typingSpeed);
      } else {
        isTyping = false; // done typing this segment
      }
    }

    // start first text
    textEl.textContent = "";
    typeText();

    document.body.addEventListener("click", () => {
      // If still typing, finish instantly
      if (isTyping) {
        textEl.textContent = segments[segmentIndex];
        isTyping = false;
        return;
      }

      // Move to next segment
      segmentIndex++;

      if (segmentIndex >= segments.length) {
        textEl.textContent = ">> END";
        hintEl.style.display = "none";
        return;
      }

      // Reset for next typing
      textEl.textContent = "";
      charIndex = 0;
      isTyping = true;
      typeText();
    });
  </script>
</body>
</html>
